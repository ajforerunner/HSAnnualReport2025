<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>H&S Strategy Roadmap — Animated</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>H&amp;S Strategy Roadmap</h1>
      <p class="subtitle">Progress across five stages — higher stages = more independent organisation</p>
    </header>

    <section class="roadmap">
      <!-- Connector line on the left -->
      <div class="connector" aria-hidden="true"></div>

      <!-- Stages will be injected here by script.js -->
      <div id="stages" class="stages"></div>
    </section>

    <footer class="page-footer">
      <div class="summary">
        <strong id="overallPercent">0%</strong>
        <span> overall engagement across all stages</span>
      </div>
      <div class="notes">Tip: edit the data in script.js to change stage percentages, colors and labels.</div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
